test_name: Validar autenticación de usuarios

includes:
  - name: common_headers
    variables:
      content_type: application/json

stages:
  - name: Login exitoso tradicional
    request:
      url: http://localhost:4000/api/auth/login
      method: POST
      headers:
        Content-Type: application/json
      json:
        email: guest@guest.com
        password: Pa$$w0rd123
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_pykwalify
        extra_kwargs:
          schema:
            type: map
            mapping:
              success:
                type: bool
                required: true
              message:
                type: str
                required: true
              data:
                type: map
                required: true
                mapping:
                  user:
                    type: map
                    required: true
                    mapping:
                      id:
                        type: int
                        required: true
                      email:
                        type: str
                        required: true
                      name:
                        type: str
                        required: true
                      role:
                        type: str
                        required: true

  - name: Login fallido por credenciales incorrectas
    request:
      url: http://localhost:4000/api/auth/login
      method: POST
      headers:
        Content-Type: application/json
      json:
        email: test@test.com
        password: wrong_password
    response:
      status_code: 401
      json:
        success: false
        message: "Invalid credentials"
        data: null

  - name: Login fallido por campos faltantes
    request:
      url: http://localhost:4000/api/auth/login
      method: POST
      headers:
        Content-Type: application/json
      json:
        email: test@test.com
    response:
      status_code: 400
      json:
        success: false
        message: "Invalid input: expected string, received undefined"
        data: null
